[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlens-engine"
version = "0.1.0"
description = "Educational AuditLens analysis foundation; no audit rules yet"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.1"]

[project.scripts]
auditlens-engine = "audit_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

